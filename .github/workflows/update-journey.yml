name: Update Journey

on:
  workflow_dispatch:
  # Forks can enable a schedule after setting config.yml.
  # schedule:
  #   - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Generate journey
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated journey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json data/daily-log.json data/events.json output/journey.svg
          if git diff --cached --quiet; then
            echo "No journey changes to commit."
          else
            git commit -m "Update generated RPG journey"
            git push
          fi
