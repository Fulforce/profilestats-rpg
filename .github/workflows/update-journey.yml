name: Update Journey

on:
  workflow_dispatch:
    inputs:
      allow-abandon:
        description: "Archive an active journey and start the newly configured journey"
        required: false
        default: false
        type: boolean
  # Forks can enable a schedule after setting .github/profile-stats-rpg.yml.
  # schedule:
  #   - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats-rpg-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate journey
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-changes: true
          allow-abandon: ${{ inputs['allow-abandon'] }}
